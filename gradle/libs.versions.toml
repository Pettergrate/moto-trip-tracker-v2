[versions]
# Baseline per docs/03-architecture/system-architecture.md (F0.8) §3.
# Revalidated against live Google/Maven Central metadata on 2026-09-15 (FND-001).
#
# NOTE: F0.8 pinned Compose BOM 2026.08.00, but that BOM resolves
# androidx.compose.ui:ui-android:1.12.0, whose AAR metadata requires
# minCompileSdk=37 (verified by downloading and inspecting the AAR directly).
# compileSdk 37 is not available in this environment's SDK and is outside
# F0.8's pinned SDK baseline (compileSdk/targetSdk 36, minSdk 26) here.
# compose-bom 2026.06.01 is the newest BOM release whose ui-android artifact
# still reports minCompileSdk<=36; used here to honor F0.8's SDK pin without
# a silent SDK bump. Revisit alongside a compileSdk 37 decision if/when made.
agp = "9.4.0"
kotlin = "2.3.21"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.11.0"
junit = "4.13.2"

# FND-002: F0.8 pinned Hilt/Dagger 2.57.1, but that release's Gradle plugin
# fails against AGP 9's new (BaseExtension-free) DSL with
# "Android BaseExtension not found" (verified by attempting the real build).
# 2.60.1 is the newest stable release and is the one verified to apply
# cleanly here; revisit if Hilt ships an AGP-9-specific patch later.
#
# KSP has separately decoupled its version string from the Kotlin version it
# targets (older releases were published as "<kotlin-version>-<ksp-patch>");
# 2.3.12 is the newest plain KSP release available and is the one verified to
# work with kotlin=2.3.21 here.
hilt = "2.60.1"
ksp = "2.3.12"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
