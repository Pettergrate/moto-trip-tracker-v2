[versions]
# Baseline per docs/03-architecture/system-architecture.md (F0.8) §3.
# Revalidated against live Google/Maven Central metadata on 2026-09-15 (FND-001).
#
# NOTE: F0.8 pinned Compose BOM 2026.08.00, but that BOM resolves
# androidx.compose.ui:ui-android:1.12.0, whose AAR metadata requires
# minCompileSdk=37 (verified by downloading and inspecting the AAR directly).
# compileSdk 37 is not available in this environment's SDK and is outside
# F0.8's pinned SDK baseline (compileSdk/targetSdk 36, minSdk 26) here.
# compose-bom 2026.06.01 is the newest BOM release whose ui-android artifact
# still reports minCompileSdk<=36; used here to honor F0.8's SDK pin without
# a silent SDK bump. Revisit alongside a compileSdk 37 decision if/when made.
agp = "9.4.0"
kotlin = "2.3.21"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.11.0"
junit = "4.13.2"

# FND-002: F0.8 pinned Hilt/Dagger 2.57.1, but that release's Gradle plugin
# fails against AGP 9's new (BaseExtension-free) DSL with
# "Android BaseExtension not found" (verified by attempting the real build).
# 2.60.1 is the newest stable release and is the one verified to apply
# cleanly here; revisit if Hilt ships an AGP-9-specific patch later.
#
# KSP has separately decoupled its version string from the Kotlin version it
# targets (older releases were published as "<kotlin-version>-<ksp-patch>");
# 2.3.12 is the newest plain KSP release available and is the one verified to
# work with kotlin=2.3.21 here.
hilt = "2.60.1"
ksp = "2.3.12"

# FND-003: Room pinned exactly per F0.8 (2.8.5). This module isn't Kotlin
# Multiplatform, so its Room artifact only exposes the classic
# Room.databaseBuilder(Context, Class) factory, not the Context-free KMP one
# (verified by attempting the latter from a test source set here — not
# visible). Robolectric supplies that Context so the single-active-capture
# invariant test (and future DAO tests) can still run as fast JVM unit tests
# instead of instrumented androidTest requiring a device. (An earlier attempt
# used androidx.sqlite:sqlite-bundled's driver API instead of Robolectric,
# but that artifact's native library is Android-ABI-only and fails with
# UnsatisfiedLinkError on a desktop JVM — removed.)
room = "2.8.5"

# TRK-002: F0.8 §3 pins play-services-location 21.4.0.
playServicesLocation = "21.4.0"

# TRK-004: F0.8 §3 pins WorkManager 2.11.2 and androidx.hilt (hilt-work,
# for @HiltWorker/HiltWorkerFactory) 1.4.0.
workManager = "2.11.2"
hiltWork = "1.4.0"

# AUTO-001: F0.8 §3 pins DataStore 1.2.1 (Preferences DataStore only - F0.8
# §12: "Nunca se guardara un Trip activo como JSON en DataStore").
datastorePreferences = "1.2.1"

# UI-001: F0.8 §3/§14 pins Navigation 3 stable (F0.8 recorded 1.1.7 as the
# newest stable release at its own cutoff; revalidated against live Maven
# metadata here — still the newest stable, 1.2.0 is only at rc01).
navigation3 = "1.1.7"
# hilt-navigation-compose gives hiltViewModel() without needing Nav3's own
# ViewModel-scoping artifact (androidx.lifecycle:lifecycle-viewmodel-navigation3),
# which has no stable release yet (2.12.0-alpha03 only, verified against live
# Maven metadata) — every screen this task builds is a navigation singleton
# (never multiple simultaneous instances with different keys), so the
# Activity-scoped default hiltViewModel() already gives correct behavior
# without that dependency at all.
#
# Pinned to 1.4.0 first (the newest stable release) but that pulls
# androidx.hilt:hilt-lifecycle-viewmodel-compose:1.4.0 and
# androidx.lifecycle:lifecycle-{runtime,viewmodel}-compose:2.11.0
# transitively, all three of which report minCompileSdk=37 (verified by
# downloading and inspecting each AAR's own metadata) — a real build
# failure against this project's compileSdk-36 pin, the same root cause as
# composeBom's own downgrade documented above. 1.3.0 is the newest release
# whose own transitive chain (hilt-lifecycle-viewmodel-compose 1.3.0,
# lifecycle-{runtime,viewmodel}-compose 2.9.1/2.10.0) reports minCompileSdk
# 35 - verified the same way. It transitively pulls the unused, older
# androidx.navigation:navigation-compose:2.9.0 (harmless dead weight, not a
# functional conflict - nothing here calls into it, hiltViewModel()'s
# no-arg form only needs LocalViewModelStoreOwner).
hiltNavigationCompose = "1.3.0"
# Explicitly pinned rather than left to the Compose BOM: the BOM alone did
# not prevent a transitive 2.11.0 resolution in practice (verified by
# attempting it) - 2.10.0 is the newest lifecycle-runtime-compose release
# confirmed at minCompileSdk=35 above.
lifecycleRuntimeCompose = "2.10.0"
lifecycleViewmodelKtx = "2.10.0"
coroutinesTest = "1.11.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
